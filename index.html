<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SalesPilot CRM — 助你掌控銷售管線、提升成交率的一站式業務管理平台。" />
    <title>SalesPilot CRM — 你的業務成長引擎</title>
    <script>
      (() => {
        const key = 'salespilot_theme';
        const isValid = (value) => value === 'light' || value === 'dark';
        const mql = window.matchMedia?.('(prefers-color-scheme: light)');
        const getSystemTheme = () => (mql?.matches ? 'light' : 'dark');
        const apply = (theme) => {
          document.documentElement.dataset.theme = theme;
        };

        const stored = window.localStorage?.getItem(key);
        apply(isValid(stored) ? stored : getSystemTheme());

        const onChange = () => {
          const nextStored = window.localStorage?.getItem(key);
          if (isValid(nextStored)) return;
          apply(getSystemTheme());
        };
        if (mql?.addEventListener) mql.addEventListener('change', onChange);
        else if (mql?.addListener) mql.addListener(onChange);

        window.addEventListener('storage', (event) => {
          if (event.key !== key) return;
          const nextStored = event.newValue;
          apply(isValid(nextStored) ? nextStored : getSystemTheme());
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
